name: Build Dev Image

on:
  push:
    branches: [dev]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Read upstream base tag
        id: base
        run: echo "tag=$(cat .upstream-base)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/companion:dev-${{ steps.base.outputs.tag }}
            ghcr.io/${{ steps.owner.outputs.name }}/companion:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Dev image built" >> $GITHUB_STEP_SUMMARY
          echo "- **Base:** \`${{ steps.base.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`ghcr.io/${{ steps.owner.outputs.name }}/companion:dev-${{ steps.base.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
