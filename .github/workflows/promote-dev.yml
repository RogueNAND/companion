name: Promote Dev to Production

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: dev

      - name: Set lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Read upstream base tag
        id: tag
        run: |
          TAG=$(cat .upstream-base)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Upstream base: $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag dev image as production
        run: |
          IMAGE="ghcr.io/${{ steps.owner.outputs.name }}/companion"
          TAG="${{ steps.tag.outputs.tag }}"

          docker buildx imagetools create \
            "$IMAGE:dev-$TAG" \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:latest"

      - name: Promote dev to patched
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin dev:patched --force

      - name: Summary
        run: |
          IMAGE="ghcr.io/${{ steps.owner.outputs.name }}/companion"
          TAG="${{ steps.tag.outputs.tag }}"
          echo "### Promoted dev → production" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`$TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`$IMAGE:$TAG\` + \`:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Source:** \`$IMAGE:dev-$TAG\` (retagged, no rebuild)" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`dev\` → \`patched\`" >> $GITHUB_STEP_SUMMARY
